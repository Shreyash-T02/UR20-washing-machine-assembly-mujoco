services:
  ur20_assembly:
    build: .
    image: ur20_assembly_ws:latest
    container_name: ur20_assembly_sim
    # Required for /dev access and some hardware acceleration paths
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # NVIDIA: set automatically when nvidia-container-toolkit is installed.
      # Remove these two lines if you don't have an NVIDIA GPU.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
    volumes:
      # X11 socket for GUI windows (MuJoCo viewer, RViz2)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Uncomment to mount local src for live development (no image rebuild needed)
      # - ./src:/ros2_ws/src:rw
    network_mode: host
    tty: true
    stdin_open: true
    command: ros2 launch wm_bringup ur20_mujoco.launch.py
