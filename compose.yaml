version: '3.8'

services:
  ur20_assembly:
    build: .
    image: ur20_assembly_ws:latest
    container_name: ur20_assembly_sim
    # Privileged mode is often required for some GUI/hardware acceleration features
    privileged: true
    # Required to pass X11 display for RViz and MuJoCo
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # Mount X11 socket
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Uncomment the following line to mount your local src directory into the container
      # This allows you to edit code locally and test it without rebuilding the image
      # - ./src:/ros2_ws/src:rw
    network_mode: host
    # Prevent container from exiting immediately
    tty: true
    stdin_open: true
    # Default command when running `docker compose up`
    command: bash -c "source /ros2_ws/install/setup.bash && ros2 launch wm_bringup ur20_mujoco.launch.py"
